<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Bokrah - AI-Driven Appointment Management System">
    <title>Signup Page - Bokrah</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
        }

        .hidden { display: none; }

        .step-indicator {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: gray;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .step-indicator.active {
            background: var(--primary-color);
        }

        .input-group {
            position: relative;
        }

        .input-group i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
        }

        .input-group input {
            padding-left: 40px;
        }

        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .password-strength {
            height: 4px;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen bg-gray-100">
    <!-- Header -->
    <header class="bg-white shadow-sm fixed w-full top-0 z-50">
        <nav class="container mx-auto px-6 py-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center">
                    <div class="text-2xl font-bold text-blue-600">
                        <i class="fas fa-calendar-check mr-2"></i>Bokrah
                    </div>
                </div>
                <div class="hidden md:flex space-x-8">
                    <a href="#" class="text-gray-600 hover:text-blue-600 transition-colors">Home</a>
                    <a href="#about" class="text-gray-600 hover:text-blue-600 transition-colors">About</a>
                    <a href="#features" class="text-gray-600 hover:text-blue-600 transition-colors">Features</a>
                    <a href="#pricing" class="text-gray-600 hover:text-blue-600 transition-colors">Pricing</a>
                    <a href="#contact" class="text-gray-600 hover:text-blue-600 transition-colors">Contact</a>
                </div>
                <div class="flex space-x-4 items-center">
                    <button onclick="showAuthModal('login')" class="px-4 py-2 text-blue-600 border border-blue-600 rounded-lg hover:bg-blue-50 transition-colors">
                        <i class="fas fa-sign-in-alt mr-2"></i>Log In
                    </button>
                    <button onclick="showAuthModal('signup')" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                        <i class="fas fa-user-plus mr-2"></i>Sign Up
                    </button>
                    <button class="md:hidden" onclick="toggleMobileMenu()">
                        <i class="fas fa-bars text-gray-600 text-xl"></i>
                    </button>
                </div>
            </div>
        </nav>
    </header>

    <!-- Mobile Menu -->
    <div class="mobile-menu md:hidden">
        <div class="p-4">
            <div class="flex justify-between items-center mb-8">
                <div class="text-2xl font-bold text-blue-600">Bokrah</div>
                <button onclick="toggleMobileMenu()">
                    <i class="fas fa-times text-gray-600 text-xl"></i>
                </button>
            </div>
            <div class="flex flex-col space-y-4">
                <a href="#" class="text-gray-600 py-2">Home</a>
                <a href="#about" class="text-gray-600 py-2">About</a>
                <a href="#features" class="text-gray-600 py-2">Features</a>
                <a href="#pricing" class="text-gray-600 py-2">Pricing</a>
                <a href="#contact" class="text-gray-600 py-2">Contact</a>
            </div>
        </div>
    </div>

    <!-- Signup Section -->
    <div class="container mx-auto px-6 py-20 mt-20">
        <div class="bg-white p-8 rounded-lg shadow-lg max-w-md mx-auto">
            <div id="step1">
                <h2 class="text-2xl font-bold mb-6">Create Your Account</h2>
                <div class="input-group mb-4">
                    <i class="fas fa-envelope"></i>
                    <input type="email" placeholder="Email" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-blue-500" required>
                </div>
                <div class="input-group mb-4">
                    <i class="fas fa-lock"></i>
                    <input type="password" placeholder="Password" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-blue-500" required>
                </div>
                <button onclick="nextStep(2)" class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition">Next</button>
                <div class="text-center my-4 text-gray-500">OR</div>
                <button onclick="signupWithGoogle()" class="w-full flex items-center justify-center bg-white border border-gray-300 text-gray-700 py-3 rounded-lg hover:bg-gray-50 transition">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" class="w-5 h-5 mr-2">
                    Sign up with Google
                </button>
            </div>
            
            <div id="step2" class="hidden">
                <h2 class="text-2xl font-bold mb-6">Let’s start with your brand</h2>
                <div class="input-group mb-4">
                    <i class="fas fa-building"></i>
                    <input type="text" placeholder="Brand Name" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-blue-500" required>
                </div>
                <select class="w-full px-4 py-2 border rounded-lg mb-4 focus:outline-none focus:border-blue-500">
                    <option>Select Industry</option>
                    <option>Salon</option>
                    <option>Medical</option>
                    <option>Fitness</option>
                    <option>Other</option>
                </select>
                <div class="flex items-center space-x-2 mb-4">
                    <select class="border rounded-lg px-3 py-2 focus:outline-none focus:border-blue-500">
                        <option>+970</option>
                        <option>+1</option>
                        <option>+44</option>
                    </select>
                    <input type="tel" placeholder="Your phone number" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-blue-500" required>
                </div>
                <div class="flex justify-between mt-4">
                    <button onclick="prevStep(1)" class="w-1/2 border py-3 rounded-lg mr-2">Back</button>
                    <button onclick="completeSignup()" class="w-1/2 bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition">Next</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function nextStep(step) {
            document.getElementById("step1").classList.add("hidden");
            document.getElementById("step2").classList.remove("hidden");
        }
        function prevStep(step) {
            document.getElementById("step2").classList.add("hidden");
            document.getElementById("step1").classList.remove("hidden");
        }
        function completeSignup() {
            alert("Signup Complete!");
        }
        function signupWithGoogle() {
            alert("Google Sign-In Clicked!");
        }
        function toggleMobileMenu() {
            const mobileMenu = document.querySelector('.mobile-menu');
            mobileMenu.classList.toggle('active');
        }
    </script>
</body>
</html>
