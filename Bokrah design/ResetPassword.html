<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Bokrah</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter">
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #4f8ef7;
            --success-color: #16a34a;
            --error-color: #dc2626;
            --text-primary: #1f2937;
            --text-secondary: #64748b;
            --bg-primary: #ffffff;
            --bg-secondary: #f9fafb;
            --border-color: #d1d5db;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-secondary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--bg-primary);
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 420px;
        }

        h1 {
            font-size: 24px;
            color: var(--text-primary);
            margin-bottom: 16px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-primary);
        }

        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 12px 48px 12px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            transition: border 0.3s, box-shadow 0.3s;
        }

        input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
            outline: none;
        }

        .password-container {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-secondary);
            outline: none;
        }

        .toggle-password:hover {
            color: var(--primary-color);
        }

        .requirements {
            margin-top: 10px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .requirement {
            margin-top: 4px;
        }

        .valid {
            color: var(--success-color);
        }

        .invalid {
            color: var(--error-color);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .error-message, .success-message {
            display: none;
            padding: 10px;
            margin-top: 20px;
            border-radius: 8px;
            color: white;
            text-align: center;
        }

        .error-message {
            background-color: var(--error-color);
        }

        .success-message {
            background-color: var(--success-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Reset Your Password</h1>
        <p class="subtitle">Please create a strong password to secure your account.</p>
        <form id="resetPasswordForm">
            <div>
                <label for="newPassword">New Password</label>
                <div class="password-container">
                    <input type="password" id="newPassword" required autocomplete="new-password" placeholder="Enter new password">
                    <button type="button" class="toggle-password" aria-label="Toggle password visibility" onclick="togglePasswordVisibility('newPassword', this)">
                        Show
                    </button>
                </div>
                <div class="requirements">
                    <div id="length" class="requirement">8+ characters</div>
                    <div id="uppercase" class="requirement">At least one uppercase letter</div>
                    <div id="lowercase" class="requirement">At least one lowercase letter</div>
                    <div id="number" the requirement">At least one number</div>
                    <div id="special" the requirement">Includes a special character (!@#$%^&*)</div>
                </div>
            </div>
            <div>
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" required autocomplete="new-password" placeholder="Confirm new password">
                <div class="error-message" id="passwordMismatch">Passwords do not match.</div>
            </div>
            <button type="submit" disabled>Reset Password</button>
        </form>
        <div class="success-message">Password reset successfully!</div>
    </div>

    <script>
        function togglePasswordVisibility(passwordId, toggleButton) {
            const passwordInput = document.getElementById(passwordId);
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleButton.textContent = 'Hide';
            } else {
                passwordInput.type = 'password';
                toggleButton.textContent = 'Show';
            }
        }

        document.getElementById('resetPasswordForm').addEventListener('input', function() {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const isMatch = newPassword === confirmPassword;
            const mismatchDisplay = isMatch ? 'none' : 'block';
            document.getElementById('passwordMismatch').style.display = mismatchDisplay;

            const validLength = newPassword.length >= 8;
            const hasUppercase = /[A-Z]/.test(newPassword);
            const hasLowercase = /[a-z]/.test(newPassword);
            const hasNumber = /[0-9]/.test(newPassword);
            const hasSpecial = /[!@#$%^&*(),.?":{}|<>]/.test(newPassword);

            const isValid = validLength && hasUppercase && hasLowercase && hasNumber && hasSpecial && isMatch;
            document.querySelector('button[type="submit"]').disabled = !isValid;
        });
    </script>
</body>
</html>
