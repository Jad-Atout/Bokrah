<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter:400,500,600">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f8f9fb;
            color: #1a1f36;
            display: flex;
        }

        .sidebar {
            width: 260px;
            height: 100vh;
            background: white;
            padding: 24px;
            position: fixed;
            box-shadow: 1px 0 10px rgba(0,0,0,0.05);
        }

        .logo {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 32px;
            color: #4f46e5;
        }

        .nav-item {
            padding: 12px 16px;
            margin: 4px 0;
            border-radius: 8px;
            cursor: pointer;
            color: #6b7280;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s;
        }

        .nav-item:hover {
            background: #f3f4f6;
            color: #4f46e5;
        }

        .nav-item.active {
            background: #ebe9fe;
            color: #4f46e5;
        }

        .main-content {
            margin-left: 260px;
            padding: 32px;
            width: calc(100% - 260px);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 600;
            color: #111827;
        }

        .button {
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .button.primary {
            background: #4f46e5;
            color: white;
        }

        .button.primary:hover {
            background: #4338ca;
        }

        .button.secondary {
            background: #f3f4f6;
            color: #374151;
        }

        .button.secondary:hover {
            background: #e5e7eb;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 1px 3px rgba(16, 24, 40, 0.1);
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
        }

        input[type="text"],
        input[type="email"],
        input[type="number"],
        textarea,
        select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.2s;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .search-bar {
            margin-bottom: 24px;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        th {
            background: #f9fafb;
            padding: 12px 24px;
            font-weight: 500;
            font-size: 14px;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
        }

        td {
            padding: 16px 24px;
            font-size: 14px;
            border-bottom: 1px solid #e5e7eb;
            color: #374151;
        }

        .chart-container {
            height: 300px;
            margin-top: 24px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 1px 3px rgba(16, 24, 40, 0.1);
        }

        .stat-title {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 600;
            color: #111827;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(4px);
            z-index: 1000;
        }

        .modal-content {
            background: white;
            width: 90%;
            max-width: 500px;
            margin: 7% auto;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
        }
    </style>
</head>

    <script>
        // Navigation
         // Navigation functionality
document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
        // Remove active class from all items
        document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
        // Add active class to clicked item
        item.classList.add('active');
        
        // Hide all sections
        document.querySelectorAll('.section').forEach(section => section.classList.remove('active'));
        // Show selected section
        const sectionId = item.getAttribute('data-section');
        document.getElementById(sectionId).classList.add('active');
    });
});

// Modal functions
function showModal(modalId) {
    document.getElementById(modalId).style.display = 'block';
}

function closeModal(modalId) {
    document.getElementById(modalId).style.display = 'none';
}

// FAQ Management
let faqs = [];

function saveFaq() {
    const question = document.getElementById('question').value;
    const answer = document.getElementById('answer').value;
    const category = document.getElementById('category').value;

    if (!question || !answer || !category) {
        alert('Please fill in all fields');
        return;
    }

    const faq = {
        id: Date.now(),
        question,
        answer,
        category
    };

    faqs.push(faq);
    updateFaqTable();
    closeModal('addFaqModal');
    clearFaqForm();
}

function updateFaqTable() {
    const tableBody = document.getElementById('faqTable');
    tableBody.innerHTML = '';

    faqs.forEach(faq => {
        const row = document.createElement('tr');
        row.innerHTML = `
            <td>${faq.question}</td>
            <td>${faq.category}</td>
            <td class="actions">
                <button class="button secondary" onclick="editFaq(${faq.id})">Edit</button>
                <button class="button secondary" onclick="deleteFaq(${faq.id})">Delete</button>
            </td>
        `;
        tableBody.appendChild(row);
    });
}

function clearFaqForm() {
    document.getElementById('question').value = '';
    document.getElementById('answer').value = '';
    document.getElementById('category').value = 'general';
}

function editFaq(id) {
    const faq = faqs.find(f => f.id === id);
    if (faq) {
        document.getElementById('question').value = faq.question;
        document.getElementById('answer').value = faq.answer;
        document.getElementById('category').value = faq.category;
        showModal('addFaqModal');
    }
}

function deleteFaq(id) {
    if (confirm('Are you sure you want to delete this FAQ?')) {
        faqs = faqs.filter(f => f.id !== id);
        updateFaqTable();
    }
}

// User Search
document.querySelector('.search-input').addEventListener('input', function(e) {
    const searchTerm = e.target.value.toLowerCase();
    const rows = document.querySelectorAll('#faqTable tr');
    
    rows.forEach(row => {
        const text = row.textContent.toLowerCase();
        row.style.display = text.includes(searchTerm) ? '' : 'none';
    });
});

// Initialize the dashboard
