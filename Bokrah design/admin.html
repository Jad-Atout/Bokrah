<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin User Management</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter:400,500,600">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 24px;
            background: #f8f9fb;
            color: #1a1f36;
        }

        .container {
            background: white;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 1px 3px rgba(16, 24, 40, 0.1), 0 1px 2px rgba(16, 24, 40, 0.06);
            margin: 0 auto;
            max-width: 1000px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin: 0;
            color: #111827;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 24px;
        }

        th {
            background: #f9fafb;
            padding: 12px 24px;
            font-weight: 500;
            font-size: 14px;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid #e5e7eb;
        }

        td {
            padding: 16px 24px;
            font-size: 14px;
            border-bottom: 1px solid #e5e7eb;
            color: #374151;
        }

        tr:hover {
            background-color: #f9fafb;
        }

        .button {
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .button.primary {
            background-color: #4f46e5;
            color: white;
        }

        .button.primary:hover {
            background-color: #4338ca;
        }

        .button.red {
            background-color: #fee2e2;
            color: #dc2626;
            border-color: transparent;
        }

        .button.red:hover {
            background-color: #fecaca;
        }

        .button.secondary {
            background-color: #f3f4f6;
            color: #374151;
        }

        .button.secondary:hover {
            background-color: #e5e7eb;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background-color: #ffffff;
            margin: 7% auto;
            padding: 32px;
            width: 90%;
            max-width: 500px;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .modal h2 {
            margin: 0 0 24px 0;
            font-size: 20px;
            font-weight: 600;
            color: #111827;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
        }

        input[type="text"], 
        input[type="email"] {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus, 
        input[type="email"]:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .modal-footer {
            display: flex;
            gap: 12px;
            margin-top: 32px;
            justify-content: flex-end;
        }

        @media (max-width: 640px) {
            body {
                padding: 16px;
            }
            
            .container {
                padding: 20px;
            }

            td, th {
                padding: 12px 16px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Admin User Management</h1>
            <button class="button primary" onclick="showModal('addUserModal', null)">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
                </svg>
                Add User
            </button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="userTable">
                <!-- User rows will be inserted here -->
            </tbody>
        </table>
    </div>

    <div id="addUserModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Add User</h2>
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Enter name" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter email" required>
            </div>
            <div class="modal-footer">
                <button class="button secondary" onclick="closeModal('addUserModal')">Cancel</button>
                <button class="button primary" onclick="saveUser()">Save User</button>
            </div>
        </div>
    </div>

    <script>
        let editingRow = null;

        function showModal(modalId, row) {
            const modal = document.getElementById(modalId);
            document.getElementById('name').value = '';
            document.getElementById('email').value = '';
            document.getElementById('modalTitle').textContent = 'Add User';

            if (row) {
                editingRow = row;
                document.getElementById('name').value = row.cells[0].textContent;
                document.getElementById('email').value = row.cells[1].textContent;
                document.getElementById('modalTitle').textContent = 'Edit User';
            }

            modal.style.display = 'block';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
            editingRow = null;
        }

        function saveUser() {
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();

            if (!name || !email) {
                alert('Please fill in all fields');
                return;
            }

            if (editingRow) {
                editingRow.cells[0].textContent = name;
                editingRow.cells[1].textContent = email;
            } else {
                const table = document.getElementById('userTable');
                const row = table.insertRow();
                row.insertCell(0).textContent = name;
                row.insertCell(1).textContent = email;
                const actionsCell = row.insertCell(2);
                actionsCell.className = 'actions';
                actionsCell.innerHTML = `
                    <button class="button secondary" onclick="showModal('addUserModal', this.parentNode.parentNode)">Edit</button>
                    <button class="button red" onclick="deleteUser(this.parentNode.parentNode)">Delete</button>
                `;
            }

            closeModal('addUserModal');
        }

        function deleteUser(row) {
            if (confirm('Are you sure you want to delete this user?')) {
                row.parentNode.removeChild(row);
            }
        }
    </script>
</body>
</html>
