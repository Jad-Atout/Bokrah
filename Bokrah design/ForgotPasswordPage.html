<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Bokrah - AI-Driven Appointment Management System">
    <title>Forgot Password - Bokrah</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="antialiased bg-gray-100">
    <!-- Header -->
    <header class="bg-white shadow-sm fixed w-full top-0 z-50">
        <nav class="container mx-auto px-6 py-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center">
                    <div class="text-2xl font-bold text-blue-600">
                        <i class="fas fa-calendar-check mr-2"></i>Bokrah
                    </div>
                </div>
                <div class="hidden md:flex space-x-8">
                    <a href="#" class="text-gray-600 hover:text-blue-600 transition-colors">Home</a>
                    <a href="#about" class="text-gray-600 hover:text-blue-600 transition-colors">About</a>
                    <a href="#features" class="text-gray-600 hover:text-blue-600 transition-colors">Features</a>
                    <a href="#pricing" class="text-gray-600 hover:text-blue-600 transition-colors">Pricing</a>
                    <a href="#contact" class="text-gray-600 hover:text-blue-600 transition-colors">Contact</a>
                </div>
                <div class="flex space-x-4 items-center">
                    <button onclick="showAuthModal('login')" class="px-4 py-2 text-blue-600 border border-blue-600 rounded-lg hover:bg-blue-50 transition-colors">
                        <i class="fas fa-sign-in-alt mr-2"></i>Log In
                    </button>
                    <button onclick="showAuthModal('signup')" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                        <i class="fas fa-user-plus mr-2"></i>Sign Up
                    </button>
                    <button class="md:hidden" onclick="toggleMobileMenu()">
                        <i class="fas fa-bars text-gray-600 text-xl"></i>
                    </button>
                </div>
            </div>
        </nav>
    </header>

    <!-- Mobile Menu -->
    <div class="mobile-menu md:hidden">
        <div class="p-4">
            <div class="flex justify-between items-center mb-8">
                <div class="text-2xl font-bold text-blue-600">Bokrah</div>
                <button onclick="toggleMobileMenu()">
                    <i class="fas fa-times text-gray-600 text-xl"></i>
                </button>
            </div>
            <div class="flex flex-col space-y-4">
                <a href="#" class="text-gray-600 py-2">Home</a>
                <a href="#about" class="text-gray-600 py-2">About</a>
                <a href="#features" class="text-gray-600 py-2">Features</a>
                <a href="#pricing" class="text-gray-600 py-2">Pricing</a>
                <a href="#contact" class="text-gray-600 py-2">Contact</a>
            </div>
        </div>
    </div>

    <!-- Forgot Password Section -->
    <section class="pt-20">
        <div class="container mx-auto px-6 py-20">
            <div class="max-w-md mx-auto bg-white rounded-lg shadow-lg p-8">
                <h2 class="text-2xl font-bold mb-4 text-gray-800">Forgot Password</h2>
                <form id="forgotPasswordForm">
                    <div class="mb-4">
                        <label for="email" class="block text-gray-700">Email</label>
                        <input type="email" id="email" name="email" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-blue-500" placeholder="Enter your email" required>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition-colors">
                        Submit
                    </button>
                </form>
                <p id="message" class="mt-4 text-gray-600"></p>
            </div>
        </div>
    </section>

    <script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', function(event) {
            event.preventDefault();
            var email = document.getElementById('email').value;
            document.getElementById('message').innerText = 'Password reset link sent to ' + email;
        });

        function toggleMobileMenu() {
            const mobileMenu = document.querySelector('.mobile-menu');
            mobileMenu.classList.toggle('active');
        }

        function showAuthModal(type) {
            const modal = document.getElementById('authModal');
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            
            modal.classList.add('active');
            
            if (type === 'login') {
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
            } else {
                loginForm.classList.add('hidden');
                signupForm.classList.remove('hidden');
            }
        }

        function closeAuthModal() {
            const modal = document.getElementById('authModal');
            modal.classList.remove('active');
        }
    </script>
</body>
</html>
